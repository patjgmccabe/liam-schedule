<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worksheets — Liam's Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=13">
  <script>if(localStorage.getItem('liamScheduleAuth'))document.documentElement.classList.add('logged-in');</script>
</head>
<body>

  <!-- Navigation -->
  <div class="navbar">
    <div class="navbar-left">
      <h1><span class="logo-icon">&#9201;</span> Liam's Schedule</h1>
      <nav id="navLinks" style="display:none;">
        <a href="index.html">Schedule</a>
        <a href="summary.html">Weekly Summary</a>
        <a href="worksheets.html" class="active">Worksheets</a>
      </nav>
    </div>
    <div class="navbar-right" id="navUser">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- Sign In Widget (shown when not authenticated) -->
  <div id="signinWidget" class="signin-widget-wrapper">
    <div class="modal login-modal signin-widget-card">
      <div class="login-modal-logo">
        <span class="logo-mark">&#9201;</span>
        <h3>Liam's <span class="teal">Schedule</span></h3>
      </div>
      <p class="login-subtitle">Sign in to view and claim shifts</p>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="widgetEmail" placeholder="your@email.com"
          onkeydown="if(event.key==='Enter') loginWidget()">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="widgetPassword" placeholder="••••••••"
          onkeydown="if(event.key==='Enter') loginWidget()">
      </div>
      <p id="widgetError" class="login-error"></p>
      <button class="btn btn-primary login-btn-full" onclick="loginWidget()">Sign In</button>
    </div>
  </div>

  <div class="container" id="mainContent" style="display:none;">

    <div class="card">
      <div class="card-header">
        <h2>Worksheets</h2>
      </div>
      <div class="worksheet-list">

        <div class="worksheet-item">
          <div class="worksheet-info">
            <span class="worksheet-name">Go Find &amp; Ask</span>
            <span class="worksheet-desc">Customizable activity worksheet — Autism Parenting Center</span>
          </div>
          <a href="go-find-ask-worksheet.pdf" target="_blank" class="btn-print-worksheet">&#128438; Print</a>
        </div>

        <div class="worksheet-item">
          <div class="worksheet-info">
            <span class="worksheet-name">How to Make a Pizza</span>
            <span class="worksheet-desc">Interactive step-by-step pizza-making activity for Liam</span>
          </div>
          <a href="pizza-steps.html" target="_blank" class="btn-print-worksheet">&#128438; Print</a>
        </div>

      </div>
    </div>

  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="worksheets.js?v=4"></script>
</body>
</html>
